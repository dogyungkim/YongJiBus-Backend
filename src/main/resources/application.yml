server:
  port: 8080

spring:
  application:
    name: yongjibus
  config:
    import: optional:file:.env[.properties]
  h2:
    console:
      enabled: true
      path: /h2-console
  datasource:
    url: jdbc:h2:mem:testdb
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connection-timeout: 5000
          timeout: 5000
          write-timeout: 5000
    auth-code-expiration-minutes: 10
    report:
      to: ${REPORT_TO}
  data:
    redis:
      host: localhost
      port: 6379
      
secrets:
  open_api_key: ${OPEN_API_KEY}
  
jwt:
  secret: ${JWT_SECRET}
  access-token-validity: 36000000    # 10시간 (10 * 60 * 60 * 1000 밀리초)
  refresh-token-validity: 604800000  # 7일 (7 * 24 * 60 * 60 * 1000 밀리초)

management:  
  endpoints:  
    prometheus:  
      enabled: true  
    web:  
      exposure:  
        include: prometheus