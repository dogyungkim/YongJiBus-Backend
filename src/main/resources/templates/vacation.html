<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>방학 기간 설정</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
        }
        input, textarea {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
        }
        .alert {
            padding: 10px;
            margin-top: 10px;
            border-radius: 4px;
        }
        .success {
            background-color: #dff0d8;
            color: #3c763d;
            border: 1px solid #d6e9c6;
        }
        .error {
            background-color: #f2dede;
            color: #a94442;
            border: 1px solid #ebccd1;
        }
        
        .current-vacation {
            background-color: #f8f9fa;
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 15px;
            margin-bottom: 20px;
        }
        
        .current-vacation h2 {
            margin-top: 0;
            color: #333;
            font-size: 1.2em;
        }
        
        .vacation-info {
            margin: 10px 0;
        }
        
        .vacation-info strong {
            display: inline-block;
            width: 80px;
        }

        .no-vacation {
            color: #666;
            font-style: italic;
        }
    </style>
</head>
<body>
    <h1>방학 기간 설정</h1>
    
    <!-- 현재 설정된 방학 정보 표시 -->
    <div class="current-vacation">
        <h2>현재 설정된 방학 정보</h2>
        <div th:if="${currentVacation}" class="vacation-info">
            <p><strong>시작일:</strong> <span th:text="${#temporals.format(currentVacation.startDate, 'yyyy-MM-dd')}"></span></p>
            <p><strong>종료일:</strong> <span th:text="${#temporals.format(currentVacation.endDate, 'yyyy-MM-dd')}"></span></p>
            <p><strong>설명:</strong> <span th:text="${currentVacation.vacationDescription}"></span></p>
        </div>
        <div th:unless="${currentVacation}" class="no-vacation">
            현재 설정된 방학 정보가 없습니다.
        </div>
    </div>
    
    <!-- 성공 메시지 표시 -->
    <div th:if="${message}" th:class="'alert ' + ${messageType}" th:text="${message}"></div>
    
    <!-- 방학 설정 폼 -->
    <h2>새로운 방학 기간 설정</h2>
    <form th:action="@{/vacation/vacation-period}" th:object="${vacationForm}" method="post">
        <div class="form-group">
            <label for="startDate">시작일:</label>
            <input type="date" id="startDate" th:field="*{startDate}" required>
            <span th:if="${#fields.hasErrors('startDate')}" th:errors="*{startDate}" class="error"></span>
        </div>
        <div class="form-group">
            <label for="endDate">종료일:</label>
            <input type="date" id="endDate" th:field="*{endDate}" required>
            <span th:if="${#fields.hasErrors('endDate')}" th:errors="*{endDate}" class="error"></span>
        </div>
        <div class="form-group">
            <label for="description">방학 설명:</label>
            <textarea id="description" th:field="*{vacationDescription}" rows="4" required></textarea>
            <span th:if="${#fields.hasErrors('vacationDescription')}" th:errors="*{vacationDescription}" class="error"></span>
        </div>
        <button type="submit">저장</button>
    </form>
</body>
</html>
